name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Generate static site
        run: |
          test -n "$NUXT_PUBLIC_SANITY_PROJECT_ID"
          npm run generate
        env:
          NITRO_PRESET: github-pages
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NUXT_PUBLIC_SANITY_PROJECT_ID }}
          NUXT_PUBLIC_SANITY_DATASET: ${{ vars.NUXT_PUBLIC_SANITY_DATASET }}
          NUXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NUXT_PUBLIC_SANITY_API_VERSION }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
